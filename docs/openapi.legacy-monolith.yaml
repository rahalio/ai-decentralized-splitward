components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
    StudyId:
      name: studyId
      in: path
      required: true
      schema:
        type: string
    RoundId:
      name: roundId
      in: path
      required: true
      schema:
        type: string
    CreditId:
      name: creditId
      in: path
      required: true
      schema:
        type: string
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ResponseMeta:
      type: object
      required:
      - requestId
      - timestamp
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Site:
      type: object
      required:
      - id
      - name
      - status
      - maxGpu
      - maxEgressMbps
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - paused
          - offboarded
        maxGpu:
          type: integer
        maxEgressMbps:
          type: integer
    SiteCreate:
      type: object
      required:
      - name
      - status
      - maxGpu
      - maxEgressMbps
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - paused
          - offboarded
        maxGpu:
          type: integer
        maxEgressMbps:
          type: integer
    DataEnvelopeSite:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/Site'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ListEnvelopeSite:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Site'
            nextCursor:
              type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Study:
      type: object
      required:
      - id
      - title
      - strategy
      - status
      - privacyApprovalStatus
      properties:
        id:
          type: string
        title:
          type: string
        strategy:
          type: string
          enum:
          - split
          - federated
          - hybrid
        status:
          type: string
          enum:
          - draft
          - approved
          - running
          - halted
          - completed
        privacyApprovalStatus:
          type: string
          enum:
          - pending
          - approved
          - rejected
        activationTtlHours:
          type: integer
    StudyCreate:
      type: object
      required:
