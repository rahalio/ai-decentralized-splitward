openapi: 3.1.0
info:
  title: Training Rounds API
  version: 0.1.0
  description: |
    Split/federated round orchestration with straggler timeouts (BR-10).
  license:
    name: Proprietary
  x-domain: rnd
servers:
  - url: https://api.splitward.local
    description: Local / Splitward API
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: TrainingRounds
    description: Split/federated training rounds
paths:
  /v0/tenants/me/training-rounds:
    get:
      operationId: listTrainingRounds
      tags: [TrainingRounds]
      summary: List TrainingRounds
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: TrainingRound list
          content:
            application/json:
              schema:
                $ref: ./training-rounds.schemas.yaml#/components/schemas/TrainingRoundListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: startTrainingRound
      tags: [TrainingRounds]
      summary: Create TrainingRound
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./training-rounds.schemas.yaml#/components/schemas/TrainingRoundCreateRequest
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./training-rounds.schemas.yaml#/components/schemas/TrainingRoundResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v0/tenants/me/training-rounds/{roundId}:
    get:
      operationId: getTrainingRound
      tags: [TrainingRounds]
      summary: Get TrainingRound
      parameters:
        - name: roundId
          in: path
          required: true
          schema:
            $ref: ./training-rounds.schemas.yaml#/components/schemas/RoundId
      responses:
        '200':
          description: TrainingRound
          content:
            application/json:
              schema:
                $ref: ./training-rounds.schemas.yaml#/components/schemas/TrainingRoundResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
