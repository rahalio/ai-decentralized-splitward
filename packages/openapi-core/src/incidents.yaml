openapi: 3.1.0
info:
  title: Incidents API
  version: 0.1.0
  description: |
    Leakage and protocol incidents with halt/quarantine (BR-8).
  license:
    name: Proprietary
  x-domain: inc
servers:
  - url: https://api.splitward.local
    description: Local / Splitward API
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: Incidents
    description: Leakage and protocol incidents
paths:
  /v0/tenants/me/incidents:
    get:
      operationId: listIncidents
      tags: [Incidents]
      summary: List Incidents
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Incident list
          content:
            application/json:
              schema:
                $ref: ./incidents.schemas.yaml#/components/schemas/IncidentListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: openIncident
      tags: [Incidents]
      summary: Create Incident
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./incidents.schemas.yaml#/components/schemas/IncidentCreateRequest
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./incidents.schemas.yaml#/components/schemas/IncidentResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v0/tenants/me/incidents/{incidentId}:
    get:
      operationId: getIncident
      tags: [Incidents]
      summary: Get Incident
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            $ref: ./incidents.schemas.yaml#/components/schemas/IncidentId
      responses:
        '200':
          description: Incident
          content:
            application/json:
              schema:
                $ref: ./incidents.schemas.yaml#/components/schemas/IncidentResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
  /v0/tenants/me/incidents/{incidentId}/halt-study:
    post:
      operationId: haltStudyForIncident
      tags: [Incidents]
      summary: Halt study and quarantine artefacts
      x-repository: none
      parameters:
        - name: incidentId
          in: path
          required: true
          schema:
            $ref: ./incidents.schemas.yaml#/components/schemas/IncidentId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ./incidents.schemas.yaml#/components/schemas/IncidentHaltStudyRequest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./incidents.schemas.yaml#/components/schemas/IncidentResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
