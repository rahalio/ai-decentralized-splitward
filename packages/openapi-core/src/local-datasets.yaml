openapi: 3.1.0
info:
  title: Local Datasets API
  version: 0.1.0
  description: |
    Handles-only local dataset registry; no raw upload (BR-1, BR-5).
  license:
    name: Proprietary
  x-domain: lds
servers:
  - url: https://api.splitward.local
    description: Local / Splitward API
security:
  - apiKey: []
  - bearerAuth: []
tags:
  - name: LocalDatasets
    description: Local dataset handles (no raw PHI)
paths:
  /v0/tenants/me/local-datasets:
    get:
      operationId: listLocalDatasets
      tags: [LocalDatasets]
      summary: List LocalDatasets
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: LocalDataset list
          content:
            application/json:
              schema:
                $ref: ./local-datasets.schemas.yaml#/components/schemas/LocalDatasetListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: registerLocalDataset
      tags: [LocalDatasets]
      summary: Create LocalDataset
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./local-datasets.schemas.yaml#/components/schemas/LocalDatasetCreateRequest
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ./local-datasets.schemas.yaml#/components/schemas/LocalDatasetResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v0/tenants/me/local-datasets/{datasetId}:
    get:
      operationId: getLocalDataset
      tags: [LocalDatasets]
      summary: Get LocalDataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            $ref: ./local-datasets.schemas.yaml#/components/schemas/DatasetId
      responses:
        '200':
          description: LocalDataset
          content:
            application/json:
              schema:
                $ref: ./local-datasets.schemas.yaml#/components/schemas/LocalDatasetResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
